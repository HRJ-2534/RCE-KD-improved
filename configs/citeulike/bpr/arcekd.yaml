bpr:
  epochs: 1000
  batch_size: 2048
  lr: 1.e-3
  wd: 1.e-5
  lmbda: 500
  mkd_tau: 1
  mkd_K: 50
  mkd_L: 50
  mkd_T: 10
  mkd_mxK: 200
  mkd_beta: 3
  sample_rank: False
  arce_sampler: marginal
  arce_mix_alpha: 0.9
  arce_sampling_power: 1.0
  arce_gamma_mode: sample_overlap
  arce_logq_lambda: 0.0

